# lit local configuration for ETCA MC tests.
# Adds binutils tool substitutions for cross-assembler tests.

import os

# The ETCA binutils directory can be specified via ETCA_BINUTILS_DIR env var,
# or defaults to etca/etca-binutils-gdb/install/bin/ relative to the LLVM source root.
binutils_dir = os.environ.get("ETCA_BINUTILS_DIR")
if not binutils_dir:
    # Try the default location relative to the LLVM source root.
    default_path = os.path.join(config.llvm_src_root, "..", "..",
                                "etca-binutils-gdb", "install", "bin")
    if os.path.isdir(default_path):
        binutils_dir = default_path

if binutils_dir and os.path.isdir(binutils_dir):
    # Add substitutions for binutils tools.
    # These can be overridden by user via ETCA_BINUTILS_DIR env var.
    tool_prefix = os.path.join(binutils_dir, "etca-unknown-elf-")
    config.substitutions.append(("%etca-as", tool_prefix + "as"))
    config.substitutions.append(("%etca-objdump", tool_prefix + "objdump"))
    config.substitutions.append(("%etca-objcopy", tool_prefix + "objcopy"))
else:
    # If binutils is not available, mark cross-tests as unsupported.
    config.unsupported = True
